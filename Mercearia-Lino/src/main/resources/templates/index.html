  <body>
    <!--Componente de Acessibilidade VLibras-->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget("https://vlibras.gov.br/app");
    </script>
    <!--Componente de Acessibilidade VLibras-->

    <!-- Menu lateral -->
    <aside class="sidebar">

    </aside>

    <!-- Esqueleto aplicação -->
    <section class="aplication">
      <div class="container-content">
        <h1>Olá, José!</h1>

        <a href="/pages/cadastro-produto.html" class="container-seller">

            <span>
              <iconify-icon icon="eva:shopping-cart-fill"></iconify-icon> Nova

        <div class="container-information">

            <div class="container-seller content">
              <span>
                <iconify-icon icon="andrsrxn:calendar-clock"></iconify-icon>
                Faturamento
              </span>

              <p>R$ 150,00</p>
            </div>
          </a>

          <a class="container-seller">
            <div class="container-seller content">
              <span>
                <iconify-icon icon="dashicons:products"></iconify-icon> Produtos
                em Estoque
              </span>

              <p>15</p>

          </a>
        </div>
      </div>

      <div class="container-image">
        <img
          src="../img/img-home-page.svg"
          alt="imagem de pessoa em frente a um caixa de pagamento com uma caixa na mão"
        />
