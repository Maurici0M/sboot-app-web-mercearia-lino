<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Vendas</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Nome da pagina -->
    <title>Mercearia Lino</title>

    <!-- Links de estilizacao -->
    <link rel="stylesheet" href="../style/global/style.css" />
    <link rel="stylesheet" href="../style/global/menu.css" />
    <link rel="stylesheet" href="../style/global/footer.css" />

    <link rel="stylesheet" href="../style/vendas.css" />

    <!-- Google Fonts Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <!-- Bootstap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Links de script -->

    <!-- Script do Iconify Web Component -->
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" defer></script>

    <!-- Script do Bootstap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>

    <!-- Scripts da aplicacao -->

    <script src="../scripts/menu.js" defer></script>

    <script src="../scripts/footer.js" defer></script>
  </head>
  <body>
    <!--Componente de Acessibilidade VLibras-->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget("https://vlibras.gov.br/app");
    </script>

    <!--Componente de Acessibilidade VLibras-->

    <!-- Menu lateral -->
    <aside class="sidebar">
      <!-- Codigo injetado via JS -->
    </aside>

    <section class="aplication">
      <div class="container-content">
        <h1>Registrar venda</h1>
         <div id="area-alerta"></div>

        <form
          class="row g-3 needs-validation"
          th:action="@{/vendas/salvar}"
          th:object="${vendas}"
          method="post"
          novalidate
        >
          <!-- Nome do Produto -->
          <div class="col-md-6">
            <label for="validationCustom01" class="form-label">Produto</label>
            <select class="form-select" id="validationCustom01" th:field="*{produto}" required>
              <option selected disabled value="">Escolha...</option>
              <option th:each="prod : ${listaProdutos}" th:value="${prod.id}" th:text="${prod.nome}" th:attr="data-preco=${prod.precoUnitario}"></option>
            </select>
          </div>

          <!-- Quantidade -->
          <div class="col-md-4">
            <label for="validationCustom02" class="form-label">Quantidade</label>
            <input
              type="number"
              class="form-control"
              id="validationCustom02"
              th:field="*{quantidade}"
              min="1"
              placeholder="Digite aqui..."
              required
           />
        </div>

          <!-- Tipo de Pagamento -->
          <div class="col-md-6">
            <label for="validationCustom03" class="form-label"
              >Tipo de Pagamento</label
            >

            <select
              class="form-select"
              id="validationCustom03"
              required
              th:field="*{formaPagamento}"
            >
              <option selected disabled value="">Escolha...</option>

              <option
                th:each="tipoPagamento : ${EnumTipoPagamento}"
                th:value="${tipoPagamento}"
                th:text="${tipoPagamento}"
              ></option>
            </select>
            <div class="invalid-feedback">
              Por favor, selecione uma opção válida!
            </div>
          </div>

          <div
            class="col-md-6"
            style="
              align-items: center;
              display: flex;
              justify-content: space-around;
            "
          >
            <button type="button" id="btnAdicionar" class="btn btn-primary">Adicionar</button>
          </div>
        </form>

        <hr />

        <table class="table table-striped table-hover table-bordered align-middle" id="tabelaVendas">
          <thead class="table-dark">
            <tr>
              <th scope="col">Produto</th>
              <th scope="col">Quantidade</th>
              <th scope="col">Forma de Pagamento</th>
              <th scope="col">Valor Unitário</th>
              <th scope="col">Valor Total</th>
               <th scope="col">Ações</th>
            </tr>
          </thead>
          <tbody>
           <!-- Os itens adicionados aparecerão aqui dinamicamente -->
          </tbody>
        </table>

        <hr />

        <div class="subtotal">
          <h2>Subtotal</h2>
          <p id="txtSubtotal">R$ 0,00</p>
        </div>

        <div class="btn-concluir">
          <button type="button" id="btnConcluir" class="btn btn-primary">Concluir</button>
        </div>

      </div>
    </section>

    <!-- Footer - Rodapé -->
    <footer class="footer">
      <!-- Injetado via JS -->
    </footer>

    <script>
      // ===== Textos dos botões da tabela =====
      // Quando seus amigos passarem o ícone, troque só estas linhas.
      // Exemplo com ícone: editar: '<iconify-icon icon="mdi:pencil"></iconify-icon>'
      const ICONES = {
        editar: 'Editar',
        excluir: 'Excluir',
        salvar: 'Salvar',
        cancelar: 'Cancelar'
      };

      // Cada item: { id, nome, unitario, dados: {o que vai para o banco} }
      let listaItensVenda = [];
      let proximoId = 0;
      let idEmEdicao = null; // id do item que está sendo editado (ou null)

      function formatarReais(valor) {
        return 'R$ ' + valor.toFixed(2).replace('.', ',');
      }

      // Mostra o alerta no mesmo estilo da tela de cadastro de produtos
      // tipo: 'success' (verde) ou 'danger' (vermelho)
      function mostrarMensagem(texto, tipo) {
        const area = document.getElementById('area-alerta');
        area.innerHTML = '';

        const alerta = document.createElement('div');
        alerta.className = 'alert alert-' + tipo + ' alert-dismissible fade show';
        alerta.setAttribute('role', 'alert');

        const span = document.createElement('span');
        span.textContent = texto;

        const botaoFechar = document.createElement('button');
        botaoFechar.type = 'button';
        botaoFechar.className = 'btn-close';
        botaoFechar.setAttribute('data-bs-dismiss', 'alert');
        botaoFechar.setAttribute('aria-label', 'Close');

        alerta.appendChild(span);
        alerta.appendChild(botaoFechar);
        area.appendChild(alerta);

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // Cria um botão pequeno da tabela
      function criarBotao(chaveIcone, classeBootstrap, aoClicar) {
        const botao = document.createElement('button');
        botao.type = 'button';
        botao.className = 'btn btn-sm ' + classeBootstrap + ' me-1';
        botao.innerHTML = ICONES[chaveIcone];
        botao.title = chaveIcone;
        botao.addEventListener('click', aoClicar);
        return botao;
      }

      function criarCelula(conteudo) {
        const td = document.createElement('td');
        if (typeof conteudo === 'string') {
          td.textContent = conteudo;
        } else {
          td.appendChild(conteudo);
        }
        return td;
      }

      // Linha normal (somente leitura)
      function criarLinhaNormal(item) {
        const tr = document.createElement('tr');
        tr.appendChild(criarCelula(item.nome));
        tr.appendChild(criarCelula(String(item.dados.quantidade)));
        tr.appendChild(criarCelula(item.dados.formaPagamento));
        tr.appendChild(criarCelula(formatarReais(item.unitario)));
        tr.appendChild(criarCelula(formatarReais(item.dados.valorVenda)));

        const tdAcoes = document.createElement('td');
        tdAcoes.appendChild(criarBotao('editar', 'btn-outline-primary', () => {
          idEmEdicao = item.id;
          atualizarTabela();
        }));
        tdAcoes.appendChild(criarBotao('excluir', 'btn-outline-danger', () => {
          listaItensVenda = listaItensVenda.filter(i => i.id !== item.id);
          if (idEmEdicao === item.id) idEmEdicao = null;
          atualizarTabela();
        }));
        tr.appendChild(tdAcoes);
        return tr;
      }

      // Linha em modo de edição (quantidade e pagamento editáveis)
      function criarLinhaEdicao(item) {
        const tr = document.createElement('tr');

        // quantidade
        const inputQtd = document.createElement('input');
        inputQtd.type = 'number';
        inputQtd.min = '1';
        inputQtd.className = 'form-control form-control-sm';
        inputQtd.value = item.dados.quantidade;

        // forma de pagamento (usa as mesmas opções do formulário)
        const selectPag = document.createElement('select');
        selectPag.className = 'form-select form-select-sm';
        document.querySelectorAll('#validationCustom03 option').forEach(opcao => {
          if (opcao.value) {
            const nova = document.createElement('option');
            nova.value = opcao.value;
            nova.textContent = opcao.textContent;
            selectPag.appendChild(nova);
          }
        });
        selectPag.value = item.dados.formaPagamento;

        tr.appendChild(criarCelula(item.nome));          // produto: fixo
        tr.appendChild(criarCelula(inputQtd));
        tr.appendChild(criarCelula(selectPag));
        tr.appendChild(criarCelula(formatarReais(item.unitario))); // valor unitário: fixo
        tr.appendChild(criarCelula(formatarReais(item.dados.valorVenda)));

        const tdAcoes = document.createElement('td');
        tdAcoes.appendChild(criarBotao('salvar', 'btn-success', () => {
          const novaQtd = parseInt(inputQtd.value);
          if (isNaN(novaQtd) || novaQtd <= 0) {
            mostrarMensagem('Informe uma quantidade válida (maior que zero).', 'danger');
            return;
          }
          item.dados.quantidade = novaQtd;
          item.dados.formaPagamento = selectPag.value;
          item.dados.valorVenda = novaQtd * item.unitario; // recalcula o total
          idEmEdicao = null;
          atualizarTabela();
        }));
        tdAcoes.appendChild(criarBotao('cancelar', 'btn-secondary', () => {
          idEmEdicao = null;
          atualizarTabela();
        }));
        tr.appendChild(tdAcoes);
        return tr;
      }

      // Redesenha a tabela e o subtotal
      function atualizarTabela() {
        const tbody = document.querySelector('#tabelaVendas tbody');
        tbody.innerHTML = '';
        let subtotal = 0;

        listaItensVenda.forEach(item => {
          subtotal += item.dados.valorVenda;
          const linha = (item.id === idEmEdicao) ? criarLinhaEdicao(item) : criarLinhaNormal(item);
          tbody.appendChild(linha);
        });

        document.getElementById('txtSubtotal').textContent = formatarReais(subtotal);
      }

      // ===== Botão Adicionar =====
      document.getElementById('btnAdicionar').addEventListener('click', function () {
        const selectProduto = document.getElementById('validationCustom01');
        const selectPagamento = document.getElementById('validationCustom03');
        const inputQuantidade = document.getElementById('validationCustom02');

        if (!selectProduto.value) {
          mostrarMensagem('Por favor, selecione um produto.', 'danger');
          return;
        }

        const quantidade = parseInt(inputQuantidade.value);
        const formaPagamento = selectPagamento.value;
        if (isNaN(quantidade) || quantidade <= 0 || !formaPagamento) {
          mostrarMensagem('Por favor, informe uma quantidade válida (maior que zero) e selecione a forma de pagamento.', 'danger');
          return;
        }

        const opcao = selectProduto.options[selectProduto.selectedIndex];
        const valorUnitario = parseFloat(opcao.getAttribute('data-preco')) || 0.0;

        listaItensVenda.push({
          id: proximoId++,
          nome: opcao.text,
          unitario: valorUnitario,
          dados: {
            produto: { id: parseInt(selectProduto.value) },
            quantidade: quantidade,
            formaPagamento: formaPagamento.trim(),
            valorVenda: quantidade * valorUnitario
          }
        });

        atualizarTabela();

        selectProduto.value = '';
        inputQuantidade.value = '';
        selectPagamento.value = '';
      });

      // ===== Botão Concluir =====
      document.getElementById('btnConcluir').addEventListener('click', function () {
        if (listaItensVenda.length === 0) {
          mostrarMensagem('Adicione pelo menos um item à tabela antes de concluir a venda.', 'danger');
          return;
        }
        if (idEmEdicao !== null) {
          mostrarMensagem('Salve ou cancele a edição do item antes de concluir.', 'danger');
          return;
        }

        const btn = this;
        btn.disabled = true; // evita clicar duas vezes e salvar a venda repetida

        fetch('/vendas/salvar-lote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(listaItensVenda.map(item => item.dados))
        })
          .then(async response => {
            if (response.ok) {
              mostrarMensagem('Venda concluída com sucesso!', 'success');
              listaItensVenda = [];
              atualizarTabela();
            } else {
              const erro = await response.text();
              mostrarMensagem('Erro ao salvar: ' + erro, 'danger');
            }
          })
          .catch(error => {
            console.error('Erro:', error);
            mostrarMensagem('Ocorreu um erro de comunicação com o servidor.', 'danger');
          })
          .finally(() => {
            btn.disabled = false;
          });
      });
    </script>
  </body>
</html>
