<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Vendas</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Nome da pagina -->
    <title>Mercearia Lino</title>

    <!-- Links de estilizacao -->
    <link rel="stylesheet" href="../style/global/style.css" />
    <link rel="stylesheet" href="../style/global/menu.css" />
    <link rel="stylesheet" href="../style/global/footer.css" />

    <link rel="stylesheet" href="../style/vendas.css" />

    <!-- Google Fonts Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <!-- Bootstap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Links de script -->

    <!-- Script do Iconify Web Component -->
    <script
      src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"
      defer
    ></script>

    <!-- Script do Bootstap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>

    <!-- Scripts da aplicacao -->

    <script src="../scripts/menu.js" defer></script>

    <script src="../scripts/footer.js" defer></script>
  </head>
  <body>
    <!--Componente de Acessibilidade VLibras-->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget("https://vlibras.gov.br/app");
    </script>

    <!--Componente de Acessibilidade VLibras-->

    <!-- Menu lateral -->
    <aside class="sidebar">
      <!-- Codigo injetado via JS -->
    </aside>

    <section class="aplication">
      <div class="container-content">
        <h1>Registrar venda (MOCK)</h1>

        <form
          class="row g-3 needs-validation"
          th:action="@{/vendas}"
          th:object="${vendas}"
          method="post"
          novalidate
        >
          <!-- Nome do Produto -->
          <div class="col-md-6">
            <label for="validationCustom01" class="form-label"
              >Nome do Produto</label
            >
            <input
              type="text"
              class="form-control"
              id="validationCustom01"
              placeholder="Digite aqui..."
              required
            />
            <div class="valid-feedback">Looks good!</div>
          </div>

          <!-- Quantidade -->
          <div class="col-md-4">
            <label for="validationCustom02" class="form-label"
              >Quantidade</label
            >
            <input
              type="number"
              class="form-control"
              id="validationCustom02"
              placeholder="Digite aqui..."
              required
            />
            <div class="valid-feedback">Looks good!</div>
          </div>

          <!-- Tipo de Pagamento -->
          <div class="col-md-6">
            <label for="validationCustom03" class="form-label"
              >Tipo de Pagamento</label
            >

            <select
              class="form-select"
              id="validationCustom03"
              required
              th:field="*{formaPagamento}"
            >
              <option selected disabled value="">Escolha...</option>

              <option
                th:each="tipoPagamento : ${EnumTipoPagamento}"
                th:value="${tipoPagamento}"
                th:text="${tipoPagamento}"
              ></option>
            </select>
            <div class="invalid-feedback">
              Por favor, selecione uma opção válida!
            </div>
          </div>

          <div
            class="col-md-6"
            style="
              align-items: center;
              display: flex;
              justify-content: space-around;
            "
          >
            <button type="button" class="btn btn-primary">Adicionar</button>
          </div>
        </form>

        <hr />

        <table class="table">
          <thead>
            <tr>
              <th scope="col">Produto</th>
              <th scope="col">Quantidade</th>
              <th scope="col">Valor Unitário</th>
              <th scope="col">Valor Total</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">Amaciante</th>
              <td>2</td>
              <td>6,00</td>
              <td>12,00</td>
            </tr>
            <tr>
              <th scope="row">Biscoito</th>
              <td>1</td>
              <td>3,00</td>
              <td>3,00</td>
            </tr>
          </tbody>
        </table>

        <hr />

        <div class="subtotal">
          <h2>Subtotal</h2>
          <p>R$ 15,00</p>
        </div>

        <div class="btn-concluir">
          <button type="button" class="btn btn-primary">Concluir</button>
        </div>

      </div>
    </section>

    <!-- Footer - Rodapé -->
    <footer class="footer">
      <!-- Injetado via JS -->
    </footer>
  </body>
</html>
