<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Faturamento - Mercearia Lino</title>

    <link rel="stylesheet" href="/style/global/style.css">
    <link rel="stylesheet" href="/style/global/menu.css">
    <link rel="stylesheet" href="/style/global/footer.css">
    <link rel="stylesheet" href="/style/faturamento.css">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        defer>
    </script>


<!-- Ícones do Google -->
<link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
>

<link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
>

<!-- Ícones Iconify -->
<script
    src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"
    defer>
</script>

    <script src="/scripts/menu.js" defer></script>
    <script src="/scripts/footer.js" defer></script>
</head>

<body>

    <aside class="sidebar"></aside>

    <section class="aplication">
        <div class="container-content">

            <h1>Faturamento</h1>

            <!-- MENSAGENS -->
            <div th:if="${sucesso}"
                 class="alert alert-success"
                 th:text="${sucesso}">
            </div>

            <div th:if="${erro}"
                 class="alert alert-danger"
                 th:text="${erro}">
            </div>

            <!-- FILTROS -->
            <h5 class="mt-4">Filtrar vendas</h5>

            <div class="mb-3">
                <button class="btn btn-outline-secondary"
                        onclick="filtrarPeriodo('hoje')">
                    Hoje
                </button>

                <button class="btn btn-outline-secondary"
                        onclick="filtrarPeriodo('mes')">
                    Este mês
                </button>

                <button class="btn btn-outline-secondary"
                        onclick="filtrarPeriodo('ano')">
                    Este ano
                </button>

                <button class="btn btn-outline-secondary"
                        onclick="filtrarPeriodo('todos')">
                    Todas
                </button>
            </div>

            <div class="row mb-4">

                <div class="col-md-4">
                    <label class="form-label">
                        Data inicial
                    </label>

                    <input type="date"
                           id="dataInicio"
                           class="form-control"
                           onchange="filtrarVendas()">
                </div>

                <div class="col-md-4">
                    <label class="form-label">
                        Data final
                    </label>

                    <input type="date"
                           id="dataFim"
                           class="form-control"
                           onchange="filtrarVendas()">
                </div>

            </div>

            <!-- TABELA -->
            <div class="table-responsive">

                <table class="table table-striped table-bordered">

                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Data</th>
                            <th>Pagamento</th>
                            <th>Total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="venda : ${listaVendas}"
                            class="linha-venda"
                            th:attr="data-data=${venda.data}">

                            <td th:text="${venda.id}"></td>

                            <td th:text="${#temporals.format(
                                venda.data, 'dd/MM/yyyy')}">
                            </td>

                            <td th:text="${#strings.replace(
                                venda.formaPagamento.name(),
                                '_', ' ')}">
                            </td>

                            <td th:text="|R$ ${#numbers.formatDecimal(
                                venda.total, 1, 'POINT', 2, 'COMMA')}|">
                            </td>

                            <td>

                                <!-- VISUALIZAR -->
                                <button type="button"
                                        class="btn btn-outline-primary btn-sm"
                                        data-bs-toggle="modal"
                                        th:attr="data-bs-target=${'#visualizar' + venda.id}">
                                    Visualizar
                                </button>

                            </td>
                        </tr>

                        <tr id="semResultados"
                            style="display: none;">
                            <td colspan="5"
                                class="text-center">
                                Nenhuma venda encontrada.
                            </td>
                        </tr>

                    </tbody>
                </table>

            </div>
        </div>
    </section>

    <!-- JANELA VISUALIZAR -->
    <div th:each="venda : ${listaVendas}"
         class="modal fade"
         th:id="|visualizar${venda.id}|"
         tabindex="-1">

        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 th:text="|Venda #${venda.id}|">
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">

                    <p><strong>Produtos comprados:</strong></p>

                    <ul class="list-group mb-3">

                        <li class="list-group-item"
                            th:each="item : ${venda.itens}">

                            <span th:text="${item.produto.nome}">
                            </span>

                            <span th:text="| - ${item.quantidade} un.|">
                            </span>

                            <span th:text="| - R$ ${#numbers.formatDecimal(
                                item.subtotal, 1, 'POINT', 2, 'COMMA')}|">
                            </span>

                        </li>
                    </ul>

                    <p>
                        <strong>Total:</strong>

                        <span th:text="|R$ ${#numbers.formatDecimal(
                            venda.total, 1, 'POINT', 2, 'COMMA')}|">
                        </span>
                    </p>

                </div>

                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Fechar
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- JANELA EDITAR -->
    <div th:each="venda : ${listaVendas}"
         class="modal fade"
         th:id="|editar${venda.id}|"
         tabindex="-1">

        <div class="modal-dialog">
            <div class="modal-content">

                <!-- FORMULARIO -->
                <form method="post"
                      th:action="@{/faturamento/editar/{id}(id=${venda.id})}">

                    <div class="modal-header">

                        <h5 th:text="|Editar venda #${venda.id}|">
                        </h5>

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal">
                        </button>

                    </div>

                    <div class="modal-body">

                        <label class="form-label">
                            Forma de pagamento
                        </label>

                        <select name="formaPagamento"
                                class="form-select"
                                required>

                            <option th:each="forma : ${formasPagamento}"
                                    th:value="${forma.name()}"
                                    th:text="${#strings.replace(
                                        forma.name(), '_', ' ')}"
                                    th:selected="${forma == venda.formaPagamento}">
                            </option>

                        </select>

                    </div>

                    <div class="modal-footer">

                        <button type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="submit"
                                class="btn btn-success">
                            Salvar alterações
                        </button>

                    </div>

                </form>

            </div>
        </div>
    </div>

    <footer class="footer"></footer>

    <!-- FILTROS POR DATA -->
    <script>

        function formatarData(data) {
            const ano = data.getFullYear();

            const mes = String(
                data.getMonth() + 1
            ).padStart(2, "0");

            const dia = String(
                data.getDate()
            ).padStart(2, "0");

            return ano + "-" + mes + "-" + dia;
        }

        function filtrarVendas() {

            const inicio = document.getElementById(
                "dataInicio"
            ).value;

            const fim = document.getElementById(
                "dataFim"
            ).value;

            const linhas = document.querySelectorAll(
                ".linha-venda"
            );

            let encontradas = 0;

            linhas.forEach(linha => {

                const dataVenda = linha.dataset.data;

                let mostrar = true;

                if (inicio && dataVenda < inicio) {
                    mostrar = false;
                }

                if (fim && dataVenda > fim) {
                    mostrar = false;
                }

                linha.style.display = mostrar ? "" : "none";

                if (mostrar) {
                    encontradas++;
                }

            });

            document.getElementById(
                "semResultados"
            ).style.display =
                encontradas === 0 ? "" : "none";
        }

        function filtrarPeriodo(periodo) {

            const hoje = new Date();

            const ano = hoje.getFullYear();
            const mes = hoje.getMonth();

            const inicio = document.getElementById(
                "dataInicio"
            );

            const fim = document.getElementById(
                "dataFim"
            );

            if (periodo === "hoje") {

                inicio.value = formatarData(hoje);
                fim.value = formatarData(hoje);

            } else if (periodo === "mes") {

                inicio.value = formatarData(
                    new Date(ano, mes, 1)
                );

                fim.value = formatarData(
                    new Date(ano, mes + 1, 0)
                );

            } else if (periodo === "ano") {

                inicio.value = ano + "-01-01";
                fim.value = ano + "-12-31";

            } else {

                inicio.value = "";
                fim.value = "";

            }

            filtrarVendas();
        }

        filtrarVendas();

    </script>

</body>
</html>
