<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Vendas</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Nome da pagina -->
    <title>Mercearia Lino</title>

    <!-- Links de estilizacao -->
    <link rel="stylesheet" href="../style/global/style.css" />
    <link rel="stylesheet" href="../style/global/menu.css" />
    <link rel="stylesheet" href="../style/global/footer.css" />

    <link rel="stylesheet" href="../style/faturamento.css" />

    <!-- Google Fonts Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <!-- Bootstap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Links de script -->

    <!-- Script do Iconify Web Component -->
    <script
      src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"
      defer
    ></script>

    <!-- Script do Bootstap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>

    <!-- Scripts da aplicacao -->

    <script src="../scripts/menu.js" defer></script>

    <script src="../scripts/footer.js" defer></script>
  </head>
  <body>
    <!--Componente de Acessibilidade VLibras-->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget("https://vlibras.gov.br/app");
    </script>

    <!--Componente de Acessibilidade VLibras-->

    <!-- Menu lateral -->
    <aside class="sidebar">
      <!-- Codigo injetado via JS -->
    </aside>

    <section class="aplication">
      <div class="container-content">
        <h1>Faturamento (MOCK)</h1>

        <!-- Search Form -->
        <div>
          <form
            action="#"
            class="search-form"
            th:action="@{/produtos}"
            method="get"
          >
            <span class="material-symbols-rounded"> search </span>
            <input
              type="date"
              placeholder="Pesquisar..."
              required
              name="nome"
              th:value="${termoBusca}"
            />

            <button type="submit" class="btn btn-primary">Pesquisar</button>
          </form>

          <a href="/produtos">Zerar</a>
        </div>

        <hr />

        <table class="table">
          <thead>
            <tr>
              <th scope="col">Produto</th>
              <th scope="col">Quantidade</th>
              <th scope="col">Valor Unitário</th>
              <th scope="col">Valor Total</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">Amaciante</th>
              <td>2</td>
              <td>6,00</td>
              <td>12,00</td>
            </tr>
            <tr>
              <th scope="row">Biscoito</th>
              <td>1</td>
              <td>3,00</td>
              <td>3,00</td>
            </tr>
          </tbody>
        </table>

        <hr />

        <div class="subtotal">
          <h2>Subtotal</h2>
          <p>R$ 15,00</p>
        </div>
      </div>
    </section>

    <!-- Footer - Rodapé -->
    <footer class="footer">
      <!-- Injetado via JS -->
    </footer>
  </body>
</html>
