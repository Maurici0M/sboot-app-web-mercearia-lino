<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Nome da pagina -->
    <title>Mercearia Lino</title>

    <!-- Links de estilizacao -->
    <link rel="stylesheet" href="../style/global/style.css" />
    <link rel="stylesheet" href="../style/global/menu.css" />
    <link rel="stylesheet" href="../style/global/footer.css" />
    <link rel="stylesheet" href="../style/produtos.css" />

    <!-- Google Fonts Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Script do Iconify Web Component -->
    <script
      src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"
      defer
    ></script>

    <!-- Script do Bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>

    <!-- Scripts da aplicacao -->
    <script src="../scripts/menu.js" defer></script>
    <script src="../scripts/footer.js" defer></script>
  </head>

  <body>
    <!-- Componente de Acessibilidade VLibras -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget("https://vlibras.gov.br/app");
    </script>

    <!-- Menu lateral -->
    <aside class="sidebar">
      <!-- Codigo injetado via JS -->
    </aside>

    <!-- Corpo do site -->
    <section class="aplication">
      <div class="container-content">
        <h1>Estoque de Produtos</h1>

        <!-- NOVO: Mensagem de sucesso -->
        <div
          th:if="${sucesso}"
          class="alert alert-success alert-dismissible fade show"
          role="alert"
        >
          <span th:text="${sucesso}"></span>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert"
            aria-label="Fechar"
          ></button>
        </div>

        <!-- NOVO: Mensagem de erro -->
        <div
          th:if="${erro}"
          class="alert alert-danger alert-dismissible fade show"
          role="alert"
        >
          <span th:text="${erro}"></span>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert"
            aria-label="Fechar"
          ></button>
        </div>

        <div class="container-content domo">
          <a
            th:href="${termoBusca != null and !#strings.isEmpty(termoBusca)}
                ? @{/produtos/relatorio(nome=${termoBusca})}
                : @{/produtos/relatorio}"
            class="btn btn-success"
          >
            Baixar Relatório (CSV Para Power BI)
          </a>

          <!-- Search Form -->
          <div>
            <form
              action="#"
              class="search-form"
              th:action="@{/produtos}"
              method="get"
            >
              <span class="material-symbols-rounded"> search </span>

              <input
                type="text"
                placeholder="Pesquisar..."
                required
                name="nome"
                th:value="${termoBusca}"
              />

              <button type="submit" class="btn btn-primary">Pesquisar</button>
            </form>

            <a href="/produtos">Zerar</a>
          </div>

          <!-- Tabela estilizada com Bootstrap -->
          <table
            class="table table-striped table-hover table-bordered align-middle"
          >
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Categoria</th>
                <th>Fornecedor</th>
                <th>Preço Unitário</th>
                <th>Estoque</th>
                <th>Valor Estocado</th>

                <!-- NOVO: Coluna de ações -->
                <th>Ações</th>
              </tr>
            </thead>

            <tbody>
              <!-- Loop do Thymeleaf -->
              <tr th:each="produto : ${listaProdutos}">
                <td th:text="${produto.id}">1</td>

                <td th:text="${produto.nome}">Nome do Produto</td>

                <td th:text="${produto.categoria}">CATEGORIA</td>

                <td
                  th:text="${produto.fornecedor != null ? produto.fornecedor.nome : 'Sem Fornecedor'}"
                >
                  Fornecedor
                </td>

                <td
                  th:text="'R$ ' + ${#numbers.formatDecimal(produto.precoUnitario, 1, 'POINT', 2, 'COMMA')}"
                >
                  R$ 0,00
                </td>

                <td th:text="${produto.quantidadeEstoque}">0</td>

                <td
                  th:text="'R$ ' + ${#numbers.formatDecimal(produto.precoUnitario * produto.quantidadeEstoque, 1, 'POINT', 2, 'COMMA')}"
                >
                  Preço Estoque
                </td>

                <!-- NOVO: Botões Editar e Excluir -->
                <td>
                  <div class="d-flex gap-2">
                    <!-- Botão Editar -->
                    <a
                      th:href="@{/produtos/editar/{id}(id=${produto.id})}"
                      class="btn btn-primary btn-sm"
                      title="Editar produto"
                    >
                      <span class="material-symbols-rounded"> edit </span>
                    </a>

                    <!-- Botão Excluir -->
                    <form
                      th:action="@{/produtos/excluir/{id}(id=${produto.id})}"
                      method="post"
                      onsubmit="
                        return confirm(
                          'Deseja realmente excluir este produto?',
                        );
                      "
                    >
                      <button
                        type="submit"
                        class="btn btn-danger btn-sm"
                        title="Excluir produto"
                      >
                        <span class="material-symbols-rounded"> delete </span>
                      </button>
                    </form>
                  </div>
                </td>
              </tr>

              <!-- Mensagem caso a lista esteja vazia -->
              <tr th:if="${#lists.isEmpty(listaProdutos)}">
                <td colspan="8" class="text-center text-muted">
                  Nenhum produto cadastrado até o momento.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Footer - Rodapé -->
    <footer class="footer">
      <!-- Injetado via JS -->
    </footer>
  </body>
</html>
